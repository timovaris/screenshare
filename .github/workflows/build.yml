name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package portable preview
        shell: pwsh
        run: ./scripts/package.ps1 -Executable ./build/Release/RegShare.exe
      - uses: actions/upload-artifact@v4
        with:
          name: RegionShare-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
